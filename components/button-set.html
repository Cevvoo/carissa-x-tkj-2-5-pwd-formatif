<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Set</title>
    <style>
        body{
            background-color: aliceblue;
            font-family: arial, sans-serif;
            padding: 20px;

        }
        
        h2{
            color: cadetblue;
            font-size: 20px;
        }
        .button-group.btn{
            margin-right: 10px;
            margin-bottom: 10px;
        }
        .btn{
            padding: 12px 24px;
            margin: 10px;
            border-radius: 8px;
            height: 15px;
            width: 120px;
            font-weight: bold;
            display: inline-block;
            text-align: center;
        }
        .btn-primary, .btn-send{
            color: white;
        }
        .btn-secondary, .btn-outline{
            color: navy;
        }
        .btn-primary{
            background-color: rgb(0, 68, 68);
            border: solid 1px blue;
        }
        .btn-secondary{
            background-color: floralwhite;
        }
        .btn-outline{
            background-color: white;
            border: solid 2px black;
        }
        .btn-send{
            background-color: darkred ;
        }
        .btn-primary:hover{
            background-color: darkcyan;
        }
        .btn-secondary:hover{
            background-color: bisque;
        }
        .btn-outline:hover{
            background-color: darkgray;
        }
        .btn-send:hover{
            background-color: red;
        }
    </style>
</head>
<body>
    <main>
        <h2>
            Button
        </h2>
        <div class="button-group">
        <div class="btn btn-primary">Lihat Proyek</div>
        <div class="btn btn-secondary">Unduh CV</div>
        <div class="btn btn-outline">Hubungi Saya</div>
        <div class="btn btn-send">Kirim Pesan</div>
        </div>
    </main>
    <footer>
        <a href="/index.html">Kembali ke Beranda</a>
    </footer>
</body>
</html>
